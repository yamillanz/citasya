<div class="employee-calendar">
  <div class="calendar-header">
    <div class="header-content">
      <h1>Mi Calendario</h1>
      <p class="subtitle">Consulta tus citas programadas</p>
    </div>
    <div class="header-actions">
      <p-button
        label="Nueva Cita"
        icon="pi pi-plus"
        (onClick)="openCreateDialog()"
        styleClass="new-appointment-btn"
        pTooltip="Agregar una nueva cita"
        tooltipPosition="bottom">
      </p-button>
      <p-button
        icon="pi pi-refresh"
        [loading]="loading()"
        (onClick)="refreshData()"
        styleClass="refresh-btn"
        [outlined]="true"
        pTooltip="Actualizar datos"
        tooltipPosition="bottom">
      </p-button>
      <p-button
        label="Tu link"
        icon="pi pi-copy"
        [loading]="copying()"
        (onClick)="copyBookingLink()"
        styleClass="booking-link-btn"
        pTooltip="Copiar enlace de reserva"
        tooltipPosition="left">
      </p-button>
    </div>
  </div>

  @if (loading()) {
    <div class="loading-state">
      <i class="pi pi-spin pi-spinner"></i>
      <p>Cargando calendario...</p>
    </div>
  } @else if (error()) {
    <div class="error-state">
      <i class="pi pi-exclamation-triangle"></i>
      <p>{{ error() }}</p>
    </div>
  } @else {
    <app-shared-calendar
      [appointments]="calendarAppointments"
      [initialView]="'dayGridMonth'"
      (appointmentClicked)="onAppointmentClick($event)"
    />
  }
</div>

<p-toast position="bottom-right"></p-toast>

<app-appointment-detail-dialog
  [appointment]="$any(selectedAppointment())"
  [visible]="showDetailsDialog()"
  [canCancel]="true"
  [canEdit]="false"
  (onClose)="closeDetailsDialog()"
  (onCancelAppointment)="handleCancelAppointment()">
</app-appointment-detail-dialog>

<app-appointment-create-dialog
  [visible]="showCreateDialog()"
  [employeeId]="user()?.id ?? ''"
  [companyId]="user()?.company_id ?? ''"
  (onClose)="showCreateDialog.set(false)"
  (onCreated)="handleAppointmentCreated()">
</app-appointment-create-dialog>
