<div class="employee-calendar">
  <div class="calendar-header">
    <div class="header-content">
      <h1>Mi Calendario</h1>
      <p class="subtitle">Consulta tus citas programadas</p>
      @if (companyName()) {
        <span class="company-context">{{ companyName() }}</span>
      }
    </div>
    <div class="header-actions">
      <p-button
        [label]="createButtonLabel()"
        icon="pi pi-plus"
        [disabled]="!selectedDate()"
        (onClick)="openCreateDialog()"
        styleClass="new-appointment-btn"
        [pTooltip]="selectedDate() ? 'Agregar una nueva cita' : 'Selecciona un día en el calendario'"
        tooltipPosition="bottom">
      </p-button>
      <p-button
        icon="pi pi-refresh"
        [loading]="loading()"
        (onClick)="refreshData()"
        styleClass="refresh-btn"
        [outlined]="true"
        pTooltip="Actualizar datos"
        tooltipPosition="bottom">
      </p-button>
      <p-button
        label="Tu link"
        icon="pi pi-copy"
        [loading]="copying()"
        [disabled]="isNotAvailable()"
        (onClick)="copyBookingLink()"
        styleClass="booking-link-btn"
        [pTooltip]="isNotAvailable() ? 'No disponible para reservas' : 'Copiar enlace de reserva'"
        tooltipPosition="left">
      </p-button>
    </div>
  </div>

  @if (loading()) {
    <div class="loading-state">
      <i class="pi pi-spin pi-spinner"></i>
      <p>Cargando calendario...</p>
    </div>
  } @else if (error()) {
    <div class="error-state">
      <i class="pi pi-exclamation-triangle"></i>
      <p>{{ error() }}</p>
    </div>
  } @else {
    <app-shared-calendar
      [appointments]="calendarAppointments"
      [initialView]="'dayGridMonth'"
      (appointmentClicked)="onAppointmentClick($event)"
      (dateClicked)="onDateClick($event)"
    />
  }
</div>

<app-appointment-detail-dialog
  [appointment]="$any(selectedAppointment())"
  [visible]="showDetailsDialog()"
  [canCancel]="true"
  [canEdit]="false"
  (onClose)="closeDetailsDialog()"
  (onCancelAppointment)="handleCancelAppointment()">
</app-appointment-detail-dialog>

<app-appointment-create-dialog
  [visible]="showCreateDialog()"
  [employeeId]="user()?.id ?? ''"
  [companyId]="user()?.company_id ?? ''"
  [date]="selectedDate()"
  (onClose)="showCreateDialog.set(false)"
  (onCreated)="handleAppointmentCreated()">
</app-appointment-create-dialog>
